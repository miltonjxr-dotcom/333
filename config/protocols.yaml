# Canonical protocol board for the agent-economy desk.
# Virtuals = ACP (Agent Commerce Protocol). Google = AP2. Do not mix.

version: 1
as_of: 2026-09-03

naming_collisions:
  ACP:
    - id: virtuals_acp
      full_name: Agent Commerce Protocol
      owner: Virtuals Protocol
    - id: openai_acp
      full_name: Agentic Commerce Protocol
      owner: OpenAI + Stripe + Meta
    - id: ibm_acp
      full_name: Agent Communication Protocol
      owner: IBM
      status: merged_into_a2a
      monitor: false
  AP2:
    - id: google_ap2
      full_name: Agent Payments Protocol
      owner: Google / FIDO
      note: "Not Virtuals. Authorization mandates, payment-agnostic."

p1_daily_onchain:
  - id: x402
    owner: Coinbase / x402 Foundation
    layer: settlement
    native_unit: t3_t4_usdc
    do_not_count: raw_txs
    token_expression: USDC
    alerts: [S1, S2, S3, S4, S5, S6, C1, C2]
  - id: virtuals_acp
    owner: Virtuals Protocol
    layer: commerce_runtime
    native_unit: unique_counterparties_and_terminal_jobs
    do_not_count: cumulative_memos
    related_erc: ERC-8183
    token_expression: VIRTUAL
    alerts: [M1, M2]
  - id: mpp
    owner: Stripe + Tempo
    layer: settlement_sessions
    native_unit: settled_events
    do_not_count: channel_opened
    token_expression: Tempo_if_any / USDC
    alerts: []
  - id: erc8004
    owner: Ethereum (MetaMask / EF / Coinbase contributors)
    layer: identity
    native_unit: reputation_with_payment_proof
    do_not_count: registrations
    token_expression: none
    alerts: [I1, I2]
  - id: a2a_x402
    owner: Google AP2 × Coinbase x402 extension
    layer: authorization_to_settlement_bridge
    native_unit: x402_txs_with_ap2_mandate_metadata
    do_not_count: unlabeled_x402
    token_expression: none

p2_weekly_spec:
  - id: google_ap2
    layer: authorization
    watch: mandate_revocation_primitive
    expression: V_MA_UCP
  - id: ucp
    owner: Google + Shopify
    layer: commerce_checkout
    expression: substitution_equities
  - id: openai_acp
    layer: merchant_checkout
    watch: instant_checkout_share_and_mor_language
    expression: openai_stripe
  - id: visa_tap
    layer: agent_identity_on_card_rail
    expression: V
  - id: mastercard_verifiable_intent
    layer: authorization_proof
    expression: MA
  - id: erc8183
    layer: proposed_job_escrow_abi
    watch: adoption_outside_virtuals

p3_event:
  - alipay_act
  - circle_agent_stack
  - rain_apa
  - china_self_discipline_convention

do_not_monitor_as_payment_protocols:
  - mcp
  - a2a_core
  - olas
  - masumi
