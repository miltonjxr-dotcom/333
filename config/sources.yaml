    url: https://agenteconomy.to/data.json
    job: t0_pulse_mpp_settled_acp_senders
    gmv: false
  - id: x402watch_data
    url: https://github.com/printmoneylab/x402watch-data
    job: sku_mix_and_loose_real
    gmv: false

weekly_eyeball:
